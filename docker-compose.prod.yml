# Production stack for the dedicated NonStick instance.
# The portfolio EC2's nginx is the public entry point and reverse-proxies
# nonstick.anasnadaf.com -> app:8082 and mlflow.anasnadaf.com -> mlflow:5000
# over the private VPC address, so only those two ports are published.
services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nonstick}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  app:
    image: ${IMAGE:-anasnadaf/nonstick:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nonstick}
      VECTOR_BACKEND: pgvector
      DATA_DIR: /data
      MODEL: ${MODEL:?set in .env}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set in .env}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      AUTH_URL: ${AUTH_URL:?set in .env — enables multi-user auth}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8082:8082"
    volumes:
      - app_data:/data
    mem_limit: 900m

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    restart: unless-stopped
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    mem_limit: 512m

volumes:
  db_data:
  app_data:
  mlflow_data:
