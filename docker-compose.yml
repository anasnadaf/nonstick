services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: nonstick
      POSTGRES_PASSWORD: nonstick
      POSTGRES_DB: nonstick
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nonstick"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://nonstick:nonstick@db:5432/nonstick
      VECTOR_BACKEND: pgvector
      DATA_DIR: /data
      # Provider is chosen purely by these model strings (LiteLLM).
      MODEL: ${MODEL:-openai/gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      LLM_MOCK: ${LLM_MOCK:-0}
      # LiteLLM picks the credential up from whichever of these matches the
      # provider prefix in MODEL / EMBEDDING_MODEL. Chat-only providers such as
      # DeepSeek need a second provider for EMBEDDING_MODEL.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      AUTH_URL: ${AUTH_URL:-}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8082:8082"
    volumes:
      - app_data:/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      # macOS AirPlay Receiver holds host port 5000, which makes this fail to
      # bind. Set MLFLOW_PORT=5001 (or disable AirPlay) if that hits you.
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  db_data:
  app_data:
  mlflow_data:
