name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  pgvector:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: nonstick
          POSTGRES_PASSWORD: nonstick
          POSTGRES_DB: nonstick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nonstick"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NONSTICK_TEST_DATABASE_URL: postgresql+asyncpg://nonstick:nonstick@localhost:5432/nonstick
      NONSTICK_TEST_EMBEDDING_DIM: "1536"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Verify migrations apply cleanly
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://nonstick:nonstick@localhost:5432/nonstick
          EMBEDDING_DIM: "1536"
      - name: Run suite against pgvector
        run: uv run pytest -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
