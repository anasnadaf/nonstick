[project]
name = "nonstick"
version = "2.0.0"
description = "Multi-user NotebookLM-style research & study assistant — agentic RAG with citations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pgvector>=0.3",
    "numpy>=1.26",
    "litellm>=1.48",
    "langgraph>=0.2.20",
    "langchain-text-splitters>=0.3",
    "langchain-mcp-adapters>=0.1",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "mlflow-skinny>=2.16",
    "typer>=0.12",
    "greenlet>=3.0",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]

[project.scripts]
nonstick = "cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "faiss-cpu>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
force-include = { "cli.py" = "cli.py" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"cli.py" = ["ASYNC240", "ASYNC250"]
"tests/*" = ["ASYNC109"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
